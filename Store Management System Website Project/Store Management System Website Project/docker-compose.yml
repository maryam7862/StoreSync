version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: storesync-postgres
    environment:
      POSTGRES_DB: storesync_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - storesync-network

  backend:
    build: ./backend
    container_name: storesync-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: storesync_db
      DB_USER: postgres
      DB_PASSWORD: postgres123
      PORT: 5000
      JWT_SECRET: your_super_secret_jwt_key_here
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    networks:
      - storesync-network

  frontend:
    image: nginx:alpine
    container_name: storesync-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - storesync-network

volumes:
  postgres_data:

networks:
  storesync-network:
    driver: bridge